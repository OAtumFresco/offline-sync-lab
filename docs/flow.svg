<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc"><title id="title">PERSIST FIRST. RETRY THE SAME OPERATION.</title><desc id="desc">A lost response leaves the local entry intact. The next attempt recovers the original result.</desc><rect width="1080" height="300" rx="18" fill="#0d1117"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9ca6b2">PERSIST FIRST. RETRY THE SAME OPERATION.</text><rect x="32" y="72" width="320" height="136" rx="12" fill="#161b22" stroke="#3d444d"/><text x="54" y="104" font-size="12" letter-spacing="1" fill="#79b8ff">01 / BROWSER</text><text x="54" y="143" font-size="23" font-weight="700" fill="#e6edf3">IndexedDB outbox</text><text x="54" y="177" font-size="14" fill="#9ca6b2">Persist a stable operation key</text><path d="M 358 140 h 15 m -6 -5 6 5 -6 5" fill="none" stroke="#79b8ff" stroke-width="2"/><rect x="380" y="72" width="320" height="136" rx="12" fill="#161b22" stroke="#3d444d"/><text x="402" y="104" font-size="12" letter-spacing="1" fill="#79b8ff">02 / NETWORK</text><text x="402" y="143" font-size="23" font-weight="700" fill="#e6edf3">Retry + receipt</text><text x="402" y="177" font-size="14" fill="#9ca6b2">Keep the note until acknowledged</text><path d="M 706 140 h 15 m -6 -5 6 5 -6 5" fill="none" stroke="#79b8ff" stroke-width="2"/><rect x="728" y="72" width="320" height="136" rx="12" fill="#161b22" stroke="#3d444d"/><text x="750" y="104" font-size="12" letter-spacing="1" fill="#79b8ff">03 / SERVER</text><text x="750" y="143" font-size="23" font-weight="700" fill="#e6edf3">SQLite transaction</text><text x="750" y="177" font-size="14" fill="#9ca6b2">Note and receipt commit together</text><text x="32" y="254" font-size="16" fill="#c9d1d9">A lost response leaves the local entry intact. The next attempt recovers the original result.</text></g></svg>
